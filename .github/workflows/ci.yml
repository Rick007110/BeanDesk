name: CI

# A push to a branch with an open pull request would otherwise run everything twice; Actions
# minutes on a private repository are limited.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android-app en core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests en debug-build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

  android-ui:
    name: App op een emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: KVM aanzetten voor de emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI-tests (app/src/androidTest)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # A phone like the ones people use: Android 15, Pixel 6 screen, animations on.
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: bash .github/scripts/android-ui-tests.sh
      - name: Screenshots en schermopnames van de gebarentests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screens
          path: ui-screens/
          if-no-files-found: ignore

  backend:
    name: Backend (API en zoeken)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beandesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Tests, tegen de migraties in database/
        run: npm test
        env:
          BEANDESK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beandesk_test

  importer:
    name: Import-script en database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beandesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: importer
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[test,extract]'
      - name: Tests, ook tegen de migraties in database/
        run: pytest -q
        env:
          BEANDESK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beandesk_test
