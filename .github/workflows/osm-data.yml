name: OpenStreetMap-data Nederland

# Builds nl-places.json from the Geofabrik extract of the Netherlands: every cafe, library and
# coworking space, plus the search cells the extract covers (importer/beandesk_import/osm_extract.py).
# It replaces the file under the release "osm-nl"; the database imports it with import_osm_file(),
# monthly via pg_cron (supabase/migrations/*_import_osm_file.sql).
on:
  schedule:
    # Geofabrik updates daily; the database imports at 05:23 on the 1st.
    - cron: "23 2 1 * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/osm-data.yml
      - importer/beandesk_import/osm_extract.py

permissions:
  contents: write

concurrency:
  group: osm-data
  cancel-in-progress: false

jobs:
  build:
    name: nl-places.json maken
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e 'importer[extract]'
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Extract downloaden
        run: |
          curl -fsSL -o netherlands.osm.pbf https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
          curl -fsSL -o netherlands.poly https://download.geofabrik.de/europe/netherlands.poly
          ls -lh netherlands.osm.pbf

      # First down to the wanted objects plus the nodes and ways they need, so reading node
      # locations stays small instead of indexing all of the Netherlands.
      - name: Filteren en omzetten
        run: |
          osmium tags-filter netherlands.osm.pbf nwr/amenity=cafe,library,coworking_space -o wanted.osm.pbf
          ls -lh wanted.osm.pbf
          python -m beandesk_import.osm_extract wanted.osm.pbf netherlands.poly --out nl-places.json --source "Geofabrik netherlands-latest.osm.pbf"

      - name: Publiceren onder de release osm-nl
        run: |
          if ! gh release view osm-nl >/dev/null 2>&1; then
            gh release create osm-nl --prerelease --title "OpenStreetMap-data Nederland" \
              --notes "Wordt maandelijks vernieuwd door de workflow osm-data.yml en door de database ingeladen met import_osm_file(). Geen app-release. © OpenStreetMap-bijdragers, ODbL."
          fi
          gh release upload osm-nl nl-places.json --clobber
