name: Release

# Every push to main publishes a pre-release with an installable APK under Releases.
# A tag such as v0.2.0 publishes a normal release; a tag with a suffix such as v0.2.0-test.1
# publishes a pre-release. Run by hand with "release" ticked, it publishes the version in
# gradle.properties (beandesk.versionName) as a normal release, tag included.
# Of the build-* pre-releases, the newest 10 stay.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publiceer beandesk.versionName als gewone release (anders een testbuild)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    name: APK publiceren
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # for the change list since the previous build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Versie bepalen
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          base=$(grep '^beandesk.versionName=' gradle.properties | cut -d= -f2)
          if [[ "$RELEASE_INPUT" == "true" ]]; then
            name="$base"
            echo "tag=v$base" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            # v0.2.0 is a release, v0.2.0-test.1 a pre-release.
            if [[ "$name" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            name="$base-build.$GITHUB_RUN_NUMBER"
            echo "tag=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: APK bouwen
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew :app:assembleDebug -Pbeandesk.versionCode="$GITHUB_RUN_NUMBER" -Pbeandesk.versionName="$VERSION_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "BeanDesk-$VERSION_NAME.apk"

      - name: Release maken
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          previous=$(git tag --list 'build-*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)
          {
            if [ "$PRERELEASE" = "true" ]; then
              echo "Testbuild van \`${GITHUB_SHA::7}\`, versie $VERSION_NAME. Download de APK hieronder en open hem op je telefoon of sleep hem op een emulator."
            else
              echo "BeanDesk $VERSION_NAME (\`${GITHUB_SHA::7}\`). Download de APK hieronder en open hem op je telefoon."
            fi
            echo
            if grep -q '^beandesk.useSampleData=true' gradle.properties; then
              echo "**Data:** de ingebouwde voorbeeldset met verzonnen zaken in Utrecht; meldingen blijven op de telefoon."
            else
              echo "**Data:** live van de eigen server, met de meldingen van iedereen."
            fi
            echo
            echo "### Wijzigingen"
            git log --no-merges -n 30 --pretty='- %s' ${previous:+"$previous..HEAD"}
          } > notes.md

          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "BeanDesk-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "BeanDesk $VERSION_NAME" \
            --notes-file notes.md \
            "${flags[@]}"

      - name: Oude pre-releases opruimen
        if: startsWith(steps.version.outputs.tag, 'build-')
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("build-")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done
