# App-configuratie. Overschrijf deze in ~/.gradle/gradle.properties of met -P,
# zodat sleutels en project-URL's niet in de repo komen.
#
# Versie van de app. De release-workflow plakt er het buildnummer achter.
beandesk.versionName=0.1.0
#
# Het Supabase-project BeanDesk: de stad-export (databasefunctie city_export) en de meldingen.
# De anon key is bedoeld om in apps te staan; wat ermee mag, regelen RLS en de migraties.
beandesk.supabaseUrl=https://hsjufnfhhiowwaiyvcvx.supabase.co
beandesk.supabaseAnonKey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzanVmbmZoaGlvd3dhaXl2Y3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMDQ1OTMsImV4cCI6MjEwODg4MDU5M30.0V-CvyElxTFQ7ZWw1TpVIBNpmNKcy7-o70wZD8-LSYU
# Kaartstijl voor MapLibre. OpenFreeMap werkt zonder sleutel en is handig tijdens ontwikkeling;
# kies voor de launch een tegelprovider (zie het plan).
beandesk.mapStyleUrl=https://tiles.openfreemap.org/styles/liberty
# De stad die de app laadt zolang er nog geen stadkeuze is.
beandesk.defaultCity=utrecht
# true: debug-builds tonen verzonnen voorbeeldzaken in Utrecht in plaats van Supabase, en
# meldingen blijven op de telefoon. Handig zonder internet. Release-builds gebruiken altijd Supabase.
beandesk.useSampleData=false
