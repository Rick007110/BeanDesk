org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# App-configuratie. Overschrijf deze in ~/.gradle/gradle.properties of met -P,
# zodat sleutels en project-URL's niet in de repo komen.
#
# Versie van de app. De release-workflow plakt er het buildnummer achter.
beandesk.versionName=0.2.2
#
# De eigen server van BeanDesk (backend/, zie docs/vps.md): de stad-export, zoeken en meldingen.
beandesk.apiUrl=https://beandesk.duckdns.org
# Kaartstijlen voor MapLibre, licht en donker (bij de donkere weergave). OpenFreeMap werkt zonder
# sleutel en mag in productie; laadt die niet, dan valt de kaart terug op VersaTiles.
beandesk.mapStyleUrl=https://tiles.openfreemap.org/styles/liberty
beandesk.mapStyleDarkUrl=https://tiles.openfreemap.org/styles/dark
beandesk.mapFallbackStyleUrl=https://tiles.versatiles.org/assets/styles/colorful/style.json
beandesk.mapFallbackStyleDarkUrl=https://tiles.versatiles.org/assets/styles/colorful-dark/style.json
# De stad die de app laadt zolang er nog geen stadkeuze is.
beandesk.defaultCity=utrecht
# true: debug-builds tonen verzonnen voorbeeldzaken in Utrecht in plaats van de server, en
# meldingen blijven op de telefoon. Handig zonder internet. Release-builds gebruiken altijd de server.
beandesk.useSampleData=false
