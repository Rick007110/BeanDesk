org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# App-configuratie. Overschrijf deze in ~/.gradle/gradle.properties of met -P,
# zodat sleutels en project-URL's niet in de repo komen.
#
# Versie van de app. De release-workflow plakt er het buildnummer achter.
beandesk.versionName=0.1.0
#
# Het Supabase-project: daar komen de stad-export (Storage) en de meldingen (database) vandaan.
# De anon key is bedoeld om in apps te staan, maar zet hem liever in ~/.gradle/gradle.properties.
# Leeg = alleen de voorbeelddata werkt.
beandesk.supabaseUrl=
beandesk.supabaseAnonKey=
# Kaartstijl voor MapLibre. OpenFreeMap werkt zonder sleutel en is handig tijdens ontwikkeling;
# kies voor de launch een tegelprovider (zie het plan).
beandesk.mapStyleUrl=https://tiles.openfreemap.org/styles/liberty
# De stad die de app laadt zolang er nog geen stadkeuze is.
beandesk.defaultCity=utrecht
# Debug-builds tonen dan verzonnen voorbeeldzaken in Utrecht in plaats van de stad-export,
# zodat de app zonder Supabase te proberen is; meldingen blijven dan op de telefoon.
# Zet op false zodra je Supabase-project klaarstaat. Release-builds gebruiken altijd Supabase.
beandesk.useSampleData=true
