# Cities the import script knows. The key is the slug used in the database and in the
# export file name (<slug>.json). `name` and `admin_level` must match the municipal
# boundary in OpenStreetMap; Dutch municipalities are admin_level 8.

[utrecht]
name = "Utrecht"
admin_level = 8
timezone = "Europe/Amsterdam"

[groningen]
name = "Groningen"
admin_level = 8
timezone = "Europe/Amsterdam"

[amsterdam]
name = "Amsterdam"
admin_level = 8
timezone = "Europe/Amsterdam"
