[project]
name = "beandesk-import"
version = "0.1.0"
description = "Imports cafés, libraries and coworking spaces from OpenStreetMap into the BeanDesk database"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.32",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["beandesk_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
