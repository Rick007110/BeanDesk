[project]
name = "beandesk-import"
version = "0.2.0"
description = "Command line access to the BeanDesk import and city export database functions"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["beandesk_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
